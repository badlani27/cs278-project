services:
  postgres:
    image: postgres:16-alpine
    container_name: soundboard-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: soundboard
    volumes:
      - soundboard_pg:/var/lib/postgresql/data

volumes:
  soundboard_pg:
